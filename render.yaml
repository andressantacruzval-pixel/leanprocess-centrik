# Blueprint de despliegue para Render.com
# Crea automaticamente el servidor web y la base de datos PostgreSQL.
databases:
  - name: examenes-db
    databaseName: examenes
    plan: free

services:
  - type: web
    name: examenes-certificacion
    runtime: node
    plan: free
    branch: claude/lean-exam-platform-yictq
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: examenes-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
