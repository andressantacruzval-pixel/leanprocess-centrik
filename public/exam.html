<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examen en curso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Pantalla de carga / error -->
  <div id="loadingView" class="center-wrap">
    <div class="card">
      <div class="brand">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 2 4 13.6h6.2L9 22l9-11.6h-6.2z" fill="#04121f" />
          </svg>
        </div>
        <h1>Cargando examen...</h1>
      </div>
      <div id="loadAlert" class="alert alert-error hidden"></div>
      <a id="backHome" href="/" class="btn-ghost btn-block hidden" style="text-align:center; display:none;">
        Volver al inicio
      </a>
    </div>
  </div>

  <!-- Examen -->
  <div id="examView" class="exam-shell hidden">
    <div class="exam-topbar">
      <div>
        <div class="title" id="examTitleBar">Examen Lean Process Implementer</div>
        <div class="student" id="studentLabel"></div>
      </div>
      <div class="timer" id="timer">
        <span>&#9201;</span><span id="timerText">--:--</span>
      </div>
    </div>

    <div class="exam-body">
      <div class="exam-main">
        <div id="cheatWarning" class="alert alert-warning hidden"></div>
        <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
        <div class="question-card">
          <div class="question-meta">
            <span class="question-num" id="questionNum">Pregunta 1</span>
            <span class="tag hidden" id="questionTag"></span>
          </div>
          <div class="question-text" id="questionText"></div>
          <div id="optionsBox"></div>
          <p class="hint" style="display:none;">
            Esta pregunta admite varias respuestas correctas.
          </p>
          <div class="exam-nav">
            <button class="btn-ghost" id="prevBtn">&larr; Anterior</button>
            <button class="btn-primary" id="nextBtn">Siguiente &rarr;</button>
          </div>
        </div>
      </div>

      <div class="exam-side">
        <div class="palette-card">
          <h3>Mapa de preguntas</h3>
          <div class="palette-grid" id="paletteGrid"></div>
          <div class="palette-legend">
            <span>&#9632; Respondida</span>
            <span>&#9633; Sin responder</span>
          </div>
          <p class="muted-text" id="answeredCount" style="margin-bottom:12px;"></p>
          <button class="btn-primary btn-block" id="finishBtn">Finalizar examen</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/exam.js"></script>
</body>
</html>
