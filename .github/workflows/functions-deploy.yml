name: Deploy Edge Functions (ai-proxy)

# Despliega la Edge Function ai-proxy y guarda GEMINI_API_KEY como secreto del
# servidor (nunca en el cliente). Necesita dos secretos de GitHub:
#   - SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#   - GEMINI_API_KEY         (una key NUEVA de Google AI Studio)
on:
  push:
    branches: [claude/desplegar-app-local-j8wbqf]
    paths: ['.github/workflows/functions-deploy.yml']
  workflow_dispatch:

env:
  PROJECT_REF: swwthzbnmpylxjqnlzdt

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check secrets present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens)." >&2
            exit 1
          fi
          if [ -z "$GEMINI_KEY" ]; then
            echo "Falta el secreto GEMINI_API_KEY (nueva key de Google AI Studio)." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guardar GEMINI_API_KEY como secreto del proyecto
        run: npx --yes supabase@latest secrets set GEMINI_API_KEY="$GEMINI_KEY" --project-ref "$PROJECT_REF"

      - name: Desplegar función ai-proxy
        run: npx --yes supabase@latest functions deploy ai-proxy --project-ref "$PROJECT_REF"

      - name: Listo
        run: echo "ai-proxy desplegada y GEMINI_API_KEY configurada en el servidor."

