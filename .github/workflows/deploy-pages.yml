name: Deploy to GitHub Pages

# Se dispara manualmente (workflow_dispatch). Publica la SPA compilada en
# GitHub Pages. La base pública es /<repo>/ y el login lo resuelve la propia app
# (VITE_STANDALONE_AUTH=1), sin depender del Hub Lite externo.
on:
  push:
    branches: [claude/desplegar-app-local-j8wbqf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Habilita Pages en el repo si aún no lo está (source = GitHub Actions).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        env:
          VITE_BASE: /andr-s-santacruz-pruebas/
          VITE_STANDALONE_AUTH: '1'
        run: npm run build

      # SPA fallback: Pages sirve 404.html en rutas profundas → recarga la app.
      - name: SPA fallback + nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

