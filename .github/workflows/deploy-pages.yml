name: Deploy to GitHub Pages

# ═══════════════════════════════════════════════════════════════════════
# Publica esta aplicación —la versión Centrik— en el GitHub Pages de SU
# repositorio.
#
# Está escrito para vivir en un repo PROPIO, separado del de la versión
# oscura. Pages da un sitio por repositorio y `deploy-pages` sustituye el
# artefacto entero: dos aplicaciones de verdad independientes necesitan dos
# repos, no dos ramas. Así cada una se despliega sola y ninguna puede pisar
# a la otra ni por accidente.
#
# La base pública se deduce del nombre del repositorio, así que este archivo
# funciona sin editar aunque el repo se llame de otra forma.
#
# REQUISITO ÚNICO, una sola vez: en Settings → Pages → Build and deployment,
# dejar Source = «GitHub Actions». No se puede automatizar —activar Pages por
# API pide permisos que el token del workflow no tiene— y sin eso el despliegue
# se detiene con «Resource not accessible by integration».
#
# El backend es el proyecto de Supabase declarado en `.env.production`. Para
# apuntar a otro proyecto se cambia ese archivo; las migraciones y el usuario
# de prueba los deja listos `db-setup.yml`.
# ═══════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, claude/transferir-diseno-lan-process-3qoioz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        env:
          # `/<nombre-del-repo>/`: donde Pages sirve los sitios de proyecto.
          VITE_BASE: /${{ github.event.repository.name }}/
          # La app resuelve su propio login, sin depender del Hub externo.
          VITE_STANDALONE_AUTH: '1'
        run: npm run build

      # Pages responde con 404.html en cualquier ruta que no sea un archivo. Al
      # ser copia del index, la SPA arranca y el router resuelve la ruta; sin
      # esto, recargar en /app/process-map daría el 404 de GitHub.
      - name: Fallback de SPA
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
